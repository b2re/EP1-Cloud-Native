spring.application.name=ms-pedidos360-bff

# Puerto del BFF
server.port=8080

# URL del microservicio Catalog
catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8081}

# URL del microservicio Orders
orders.service.url=${ORDERS_SERVICE_URL:http://localhost:8082}

# =========================================================
# Microsoft Entra ID (validación del JWT)
# Reemplazar los valores por defecto o definir las variables de entorno.
# =========================================================
# Directory (tenant) ID
entra.tenant-id=${ENTRA_TENANT_ID:00000000-0000-0000-0000-000000000000}
# Issuer de los access tokens v2.0
entra.issuer=${ENTRA_ISSUER:https://login.microsoftonline.com/${entra.tenant-id}/v2.0}
# Llaves públicas con las que se verifica la firma del token
entra.jwk-set-uri=${ENTRA_JWK_SET_URI:https://login.microsoftonline.com/${entra.tenant-id}/discovery/v2.0/keys}
# Audiencias aceptadas: Application (client) ID de la API y su Application ID URI
entra.audiences=${ENTRA_AUDIENCES:00000000-0000-0000-0000-000000000000,api://pedidos360-api}

# Orígenes permitidos para CORS (solo desarrollo local; en AWS lo maneja API Gateway)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
