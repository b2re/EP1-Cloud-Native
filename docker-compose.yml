# Despliegue de Pedidos360 en EC2: MySQL + catalog + orders + BFF.
# Solo el BFF publica un puerto; catalog, orders y MySQL solo son accesibles en la red interna.
# Variables en el archivo .env (no se sube a GitHub). Ver .env.example.
services:

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  catalog:
    build: ./ms-pedidos360-catalog
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pedidos360_catalog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_JPA_SHOW_SQL: "false"

  orders:
    build: ./ms-pedidos360-orders
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_pedidos360?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_JPA_SHOW_SQL: "false"
      CATALOG_SERVICE_URL: http://catalog:8081

  bff:
    build: ./ms-pedidos360-bff
    restart: unless-stopped
    depends_on:
      - catalog
      - orders
    ports:
      - "${BFF_PORT:-8080}:8080"
    environment:
      CATALOG_SERVICE_URL: http://catalog:8081
      ORDERS_SERVICE_URL: http://orders:8082
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-00000000-0000-0000-0000-000000000000}
      ENTRA_AUDIENCES: ${ENTRA_AUDIENCES:-00000000-0000-0000-0000-000000000000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}

volumes:
  mysql_data:
