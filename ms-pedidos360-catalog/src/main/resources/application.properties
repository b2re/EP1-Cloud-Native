spring.application.name=ms-pedidos360-catalog

# Puerto del microservicio Catalog
server.port=8081

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/pedidos360_catalog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true