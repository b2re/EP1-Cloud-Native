version: '3.8'

services:

  # Base de datos MySQL para Pedidos360
  mysql:
    image: mysql:8.0
    container_name: mysql_pedidos360

    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: db_pedidos360
      MYSQL_ALLOW_EMPTY_PASSWORD: yes

    ports:
      - "3306:3306"

    volumes:
      - pedidos360_mysql_data:/var/lib/mysql

    networks:
      - pedidos360_network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10


  # Microservicio Orders
  app:
    build: .
    container_name: pedidos360_orders_app

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_pedidos360?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""

    ports:
      - "8082:8082"

    networks:
      - pedidos360_network


volumes:
  pedidos360_mysql_data:


networks:
  pedidos360_network: