spring.application.name=ms-pedidos360-orders

# Puerto del microservicio Orders
server.port=8082

# URL del microservicio Catalog (validación de productos y descuento de stock)
catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8081}

# Base de datos local Pedidos360
spring.datasource.url=jdbc:mysql://localhost:3306/db_pedidos360?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html